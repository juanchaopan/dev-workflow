name: self-test

# The plugin's own checkup: unit tests of the scripts (including a real screenshot by the screen rendering script), plugin manifest
# validation, and a smoke test per stack (creates a real project, runs the self-check commands, confirms violations are caught).
# Versions are looked up exactly as when a project is created: runtimes on the current LTS, libraries and tools on their latest
# release; the typescript-eslint variant uses the highest TypeScript it supports.
# Runs every Monday: when generators, tool versions, LTS releases or default configurations change, this breaks first.
# A failed scheduled run opens an issue.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npx -y playwright install --with-deps chromium
      - run: node --test "tests/*.test.mjs"
        env:
          RENDER_SMOKE: '1'
      - run: npx -y @anthropic-ai/claude-code plugin validate .

  stacks:
    name: stack (${{ matrix.stack }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: angular
          - stack: react-ts
          - stack: node-ts
            variant: oxlint
          - stack: node-ts
            variant: eslint
          - stack: python
          - stack: spring-boot
            variant: maven
          - stack: spring-boot
            variant: gradle
          - stack: dotnet-blazor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - id: lts
        run: |
          echo "java=$(node skills/scaffold/shared/versions.mjs lts eclipse-temurin)" >> "$GITHUB_OUTPUT"
          echo "dotnet=$(node skills/scaffold/shared/versions.mjs lts dotnet)" >> "$GITHUB_OUTPUT"
      - if: ${{ matrix.stack == 'spring-boot' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.lts.outputs.java }}
      - if: ${{ matrix.stack == 'python' }}
        uses: astral-sh/setup-uv@v6
      - if: ${{ matrix.stack == 'dotnet-blazor' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.lts.outputs.dotnet }}.0.x
      - run: bash tests/stacks/${{ matrix.stack }}.sh
        env:
          BUILD_TOOL: ${{ matrix.stack == 'spring-boot' && matrix.variant || '' }}
          LINT: ${{ matrix.stack == 'node-ts' && matrix.variant || '' }}
          WORK: ${{ runner.temp }}/smoke

  report:
    name: report
    needs: [scripts, stacks]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Weekly self-test failed: $(date -u +%Y-%m-%d)" \
            --body "A check of the weekly self-test failed, most likely because a generator, tool version, LTS release or default configuration changed. Log: $RUN_URL

          To fix it locally: open Claude Code, say which stack's smoke test failed and paste the log, have it update that stack's stack.md and configuration files, then run the matching script in tests/stacks/ to confirm it passes. Do not fix it by pinning an old version."
