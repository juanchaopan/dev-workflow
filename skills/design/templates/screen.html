<!doctype html>
<html lang="{{界面语言，例如 zh-CN}}">
  <head>
    <meta charset="utf-8" />
    <!-- 截图尺寸（宽x高）。宽度固定，高度是最小高度，内容更长时截整页。手机画面用 390x844。 -->
    <meta name="screenshot-size" content="1280x800" />
    <title>SCR-{{001}} {{画面名称}}（{{状态}}）</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* 只写这个画面特有的布局。颜色、字号、间距一律用 tokens.css 里的变量。 */
    </style>
  </head>
  <body>
    <!--
      静态原型，只给人看：纯 HTML 和 CSS，不用框架、不写脚本、不连接口。
      画出这个状态下用户看到的全部内容；数据用真实感的样例：真实的姓名和金额、长短不一的文字。
      项目的顺序和文字和画面定义里的项目定义表一致。
    -->
  </body>
</html>
