<!doctype html>
<html lang="{{UI language, e.g. en}}">
  <head>
    <meta charset="utf-8" />
    <!-- Screenshot size (width x height). The width is fixed; the height is a minimum and taller content is captured in full. Use 390x844 for phone screens. -->
    <meta name="screenshot-size" content="1280x800" />
    <title>SCR-{{001}} {{screen name}} ({{state}})</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* Only the layout specific to this screen. Colors, font sizes and spacing always come from the variables in tokens.css. */
    </style>
  </head>
  <body>
    <!--
      A static prototype for people to look at: plain HTML and CSS, no frameworks, no scripts, no API calls.
      Draw everything the user sees in this state, with realistic sample data: real-looking names and amounts, text of different lengths.
      Fields appear in the same order and with the same text as the field definitions in the screen definition.
    -->
  </body>
</html>
