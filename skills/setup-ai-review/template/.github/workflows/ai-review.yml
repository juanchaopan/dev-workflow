name: ai-review

# Risk tier, AI code review and the human confirmation gate for every PR.
#   risk          Assigns the PR a tier from .github/risk-rules.txt and labels it. The rules are read from the target branch,
#                 so a PR cannot change its own tier.
#   claude-review Claude reviews the change against CLAUDE.md, REVIEW.md, .claude/rules/, the design in docs/design/ and the PR
#                 description, posting findings as inline comments. Branch rules require every review thread to be resolved before
#                 merging, so each finding is fixed or closed with a stated reason.
#                 After MAX_ROUNDS rounds the automatic review stops and asks the author to reconsider the approach.
#                 Not reviewed: release PRs (release/*) and PRs merging back from main or master, which contain only reviewed code;
#                 PRs from forks and Dependabot, which GitHub gives no access to secrets. Maintainers can comment @claude on the PR
#                 to ask for a review.
#   risk-gate     Medium and high risk PRs pass only with the human-reviewed label. Branch rules make it a required check.
# Adding or removing labels reruns only risk and risk-gate, never the AI review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'code' }}
  cancel-in-progress: true

jobs:
  risk:
    name: risk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      approved: ${{ steps.classify.outputs.approved }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - id: classify
        run: node .github/scripts/risk-classify.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

  claude-review:
    name: claude-review
    needs: risk
    if: >-
      ${{
        github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/') &&
        github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'master'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
      id-token: write
    env:
      MAX_ROUNDS: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect earlier review comments and the round number
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .ai-review-context
          gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq '.[] | "- \(.path):\(.line // .original_line // "?") \(.body | split("\n")[0])"' \
            > .ai-review-context/previous-comments.md
          done_rounds=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- ai-review-summary -->")) | .id' | wc -l)
          echo "round=$((done_rounds + 1))" >> "$GITHUB_OUTPUT"
          if [ "$done_rounds" -ge "$MAX_ROUNDS" ]; then
            echo "capped=true" >> "$GITHUB_OUTPUT"
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify when the round limit is reached
        if: ${{ steps.context.outputs.capped == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -q '<!-- ai-review-capped -->'; then
            body=$(printf '%s\n%s' '<!-- ai-review-capped -->' \
              "The AI review has run $MAX_ROUNDS rounds without converging, so automatic review is paused. Consider a different approach: split the PR, or implement it differently. To keep reviewing, run code-review locally.")
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi

      - name: Claude review
        if: ${{ steps.context.outputs.capped != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repository: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number }}
            Risk tier: ${{ needs.risk.outputs.tier }}
            Review round: ${{ steps.context.outputs.round }} (limit ${{ env.MAX_ROUNDS }})
            New commits: ${{ github.event.before }}..${{ github.event.after }} (set only when the PR received new commits)

            You are this repository's code reviewer. Review this PR as follows.

            1. Read CLAUDE.md (project conventions), REVIEW.md (review standards) and the standards in `.claude/rules/` that cover the changed files. REVIEW.md wins on conflicts and sets the comment language.
            2. Read the PR description and linked issue with `gh pr view` to understand the intent, and the change with `gh pr diff`. Where needed, read other code and the requirements, architecture and design documents under docs/ to see how the change fits the project. For bug fixes, check that the root cause is fixed.
            3. Set the depth by risk tier:
               - low: only confirm there is no obvious error.
               - medium: check logic, error handling, tests and layering completely.
               - high: work through boundary conditions, concurrency, failure paths, data loss and rollback one by one, taking the time it needs.
            4. After the first round: read `.ai-review-context/previous-comments.md` first; it lists the inline comments already posted, which you must not repeat. Focus on the new commits above (`git diff <from>..<to>`), unless they affect code elsewhere.
            5. Report only real problems: logic errors; mismatches with the PR description or the issue's acceptance criteria; violations of CLAUDE.md or `.claude/rules/` (layering included); deviations from accepted decisions in docs/adr/; behavior users can see that differs from the design in docs/design/ without the PR changing the design or explaining why; the problems listed under "Patchwork and bloat" in REVIEW.md; content in CLAUDE.md that no longer matches the code. Leave pure formatting and style to lint. Verify each finding before posting: report it only when you can name the file, line and trigger, never on a guess from names alone.
            6. Post each finding on its line with `mcp__github_inline_comment__create_inline_comment`, starting with [Important], [Nit] or [Pre-existing] (a problem that existed before this change). When the same problem appears in several places, list every location in the first comment and ask for them to be fixed together.
            7. Finally post a summary with `gh pr comment`. Its first line is exactly `<!-- ai-review-summary -->`; its second line starts with "Found N problems", or reads "Found 0 problems, no changes needed". The summary states the risk tier and the round.
            8. Do not approve the PR, and do not change or commit code.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  risk-gate:
    name: risk-gate
    needs: risk
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TIER: ${{ needs.risk.outputs.tier }}
          APPROVED: ${{ needs.risk.outputs.approved }}
        run: |
          if [ "$TIER" = "low" ]; then
            echo "Low risk; no human confirmation needed."
          elif [ "$APPROVED" = "true" ]; then
            echo "Risk tier $TIER; confirmed by a human."
          else
            echo "::error::Risk tier $TIER: read this commit's changes yourself and add the human-reviewed label to the PR once satisfied (if the label is already there but new commits arrived since, remove it and add it again)."
            exit 1
          fi
