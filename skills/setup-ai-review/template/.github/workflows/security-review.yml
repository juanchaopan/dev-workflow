name: security-review

# Security review for every PR, separate from the code review in ai-review and limited to security problems.
# Findings are posted as inline comments. Branch rules require every review thread to be resolved before merging, so each
# security problem is either fixed or closed with a stated reason.
# Not reviewed: release PRs (release/*) and PRs merging back from main or master, which contain only reviewed code;
# PRs from forks and Dependabot, which GitHub gives no access to secrets. Maintainers can comment @claude on the PR to ask for a
# security review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security-review
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/') &&
        github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'master'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect earlier review comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .ai-review-context
          gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq '.[] | "- \(.path):\(.line // .original_line // "?") \(.body | split("\n")[0])"' \
            > .ai-review-context/previous-comments.md

      - name: Claude security review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repository: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number }}
            New commits: ${{ github.event.before }}..${{ github.event.after }} (set only when the PR received new commits)

            You are this repository's security reviewer. Look only for security problems, not code style or ordinary logic errors.

            1. Read CLAUDE.md and REVIEW.md to learn about the project and the comment language; when docs/architecture/ has architecture documents, read the trust boundaries and authentication. Use `gh pr view` and `gh pr diff` for the PR's intent and changes, and read other code in the repository where needed.
            2. Focus on:
               - Injection: SQL, shell commands, path concatenation, templates, logs
               - Authentication and authorization: missing checks, access to other people's data, unauthenticated calls between services
               - Secrets, tokens and passwords in code, logs or error messages
               - Untrusted input: deserialization, SSRF, XSS, open redirects, file uploads
               - Cryptography: home-made crypto, weak randomness, unsafe comparisons
               - Dependencies and install scripts: newly added dependencies, scripts executed straight after download
               - CI workflows and deployment configuration: excessive permissions, or untrusted content such as PR titles and branch names inserted directly into run commands
               - Sensitive data: personal data or internal addresses leaking to the frontend or third parties
            3. Read `.ai-review-context/previous-comments.md` first and do not repeat problems already raised. When the PR received new commits, focus on the new commits above.
            4. Report only problems whose attack path you can state: who, through which input, can achieve what. Do not report what you cannot explain.
            5. Post each problem on its line with `mcp__github_inline_comment__create_inline_comment`, starting with [Security], with the attack path and the fix.
            6. Finally post a summary with `gh pr comment`. Its first line is exactly `<!-- security-review-summary -->`; its second line starts with "Found N security problems", or reads "Found 0 security problems".
            7. Do not approve the PR, and do not change or commit code.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
