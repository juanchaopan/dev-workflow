name: ci

# 必需的自动检查：每个组件的 lint、架构检查、类型检查、测试、构建，以及整个仓库的重复代码检查。
# 分支规则按 job 名 "ci" 把汇总 job 设为合并前必须通过：它在所有其他 job 结束后运行，任何一个失败它就失败。
# 这里的命令和 CLAUDE.md「自检命令」保持一致，本地能过的，CI 上也应该能过。

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplication:
    name: duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npx --yes jscpd@5 .

  # ---- 项目专属：每个组件一个 job，按各技术栈 stack.md 的"CI 步骤"写 ----
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run arch --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
  # ---- 项目专属：结束 ----

  ci:
    name: ci
    if: always()
    needs: [duplication, app]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "全部检查通过"
