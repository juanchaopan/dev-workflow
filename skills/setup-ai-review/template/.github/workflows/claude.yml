name: claude

# Write @claude in an issue, PR or comment and Claude handles the request in the cloud: answers questions, implements issues,
# changes PRs following review comments, reviews outside contributors' PRs.
# Only people with write access to the repository can trigger it (claude-code-action checks the requester's permissions).
# The code it changes goes to a new feature/ branch or the current PR's branch and, as with local development, must pass every
# check and review before merging.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      ${{
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---- Project-specific: install the tools the self-check commands need, as in the component jobs of ci.yml ----
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      # ---- Project-specific: end ----

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: feature/
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),{{Bash permissions for the self-check commands, e.g. Bash(npm run lint:*),Bash(npm test:*)}}"
            --append-system-prompt "Work by CLAUDE.md, .claude/rules/ and REVIEW.md. Before changing anything, read the relevant requirement, architecture and design documents (docs/). Each commit does one thing, with a Conventional Commits message that includes the issue number. Run the self-check commands in CLAUDE.md before committing and make sure they pass. When a request means a significant change to requirements, design or architecture, or its acceptance criteria are unclear, do not change the code; explain why in a comment and suggest that a maintainer handles it locally with /change."
