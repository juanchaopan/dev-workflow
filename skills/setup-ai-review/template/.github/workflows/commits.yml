name: commits

# Checks that every commit message in the PR follows Conventional Commits, with the same rules as the local .githooks/commit-msg.
# Branch rules require the job named "commit-lint" before merging.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-commit-message.mjs --range "$BASE..$HEAD"
