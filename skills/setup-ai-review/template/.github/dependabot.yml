# Automatic dependency updates: Dependabot checks weekly and opens PRs for new versions, which go through the usual checks and reviews.
# Commit message prefixes are build and ci with a scope, producing "build(deps): bump ...", which follows Conventional Commits.
# Minor and patch updates share one PR; major updates get their own, since they often break things and need their release notes read.
#
# TypeScript and the tools that read it (typescript-eslint, dependency-cruiser) are one group and move together. This matters for
# projects that chose typescript-eslint: when TypeScript ships a new major the tools do not support yet, this group's PR fails its
# checks (lint reports an unsupported version). Do not merge it and do not relax rules to make it pass; leave the PR open.
# Dependabot regenerates it every week with the tools' newest releases, and once the tools catch up the checks pass and it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # ---- Project-specific: one entry per component. package-ecosystem follows the stack: npm, maven, gradle, uv, pip, nuget ----
  # npm components keep the typescript-toolchain group; in Angular components TypeScript follows Angular and is upgraded with
  # ng update, so it stays out of this group there.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      typescript-toolchain:
        patterns: ["typescript", "typescript-eslint", "@typescript-eslint/*", "dependency-cruiser"]
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  # ---- Project-specific: end ----
