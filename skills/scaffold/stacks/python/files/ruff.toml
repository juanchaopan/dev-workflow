# ruff formatting and lint configuration. The target Python version comes from requires-python in pyproject.toml.
line-length = 100

[lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes: unused variables and imports, undefined names
  "I",     # import sorting
  "B",     # bugbear: common bug patterns
  "UP",    # newer Python syntax
  "SIM",   # simplifiable code
  "N",     # PEP 8 naming
  "S",     # bandit: security problems
  "PTH",   # pathlib instead of os.path
  "DTZ",   # datetimes without a time zone
  "T20",   # print
  "ASYNC", # blocking calls in async code
  "C90",   # cyclomatic complexity
  "PLR",   # functions too long, too many arguments, too many branches
  "RUF",   # ruff's own rules
]
# Line length is left to the formatter; long strings it cannot wrap are not reported.
# PLR2004 (magic numbers) produces too many false positives in tests and common limits; reviewers judge it instead.
ignore = ["E501", "PLR2004"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[lint.per-file-ignores]
# Tests may use assert.
"tests/**" = ["S101"]

[format]
docstring-code-format = true
