name: deploy

# Builds container images, pushes them to GitHub Container Registry, then deploys:
#   push to the integration branch (develop for Git Flow, main for GitHub Flow) → staging
#   push a version tag v* → production (environment: production, needs manual approval)
# Images are tagged with the commit SHA, and with the version on release. Rollback: rerun this workflow for an older version tag,
# or switch back to the older image on the platform.
# See shared/deployment.md in the scaffold skill.
# Placeholders in this file are written <...>; {{version}} in tags is docker/metadata-action syntax and stays as it is.

on:
  push:
    branches: ['<integration branch>']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ---- Project-specific: one entry per containerized component ----
        component:
          - name: '<component name>'
            dir: '<component directory>'
        # ---- Project-specific: end ----
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component.name }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      # ---- Project-specific: the chosen platform's deployment steps; tokens come from the current environment's secrets ----
      - run: echo "Deploying ${{ github.sha }} to ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}"
      # ---- Project-specific: end ----
